<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 240 240" role="img" aria-label="Loading">
  <!-- The animated MII mark (the loader from the original HAGI page): the
       twelve lines draw themselves in, the outer nodes pulse around the
       hexagon, the core breathes and a gold glow swells behind it. -->
  <defs>
    <linearGradient id="lsg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="65%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .glow { animation: glow 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes glow { 0%, 100% { opacity: 0.25; transform: scale(0.98); } 50% { opacity: 0.75; transform: scale(1.04); } }
    .lines line { stroke-dasharray: 90; stroke-dashoffset: 90; animation: draw 2.8s ease-in-out infinite; }
    .lines line:nth-child(1) { animation-delay: 0s; }
    .lines line:nth-child(2) { animation-delay: 0.08s; }
    .lines line:nth-child(3) { animation-delay: 0.16s; }
    .lines line:nth-child(4) { animation-delay: 0.24s; }
    .lines line:nth-child(5) { animation-delay: 0.32s; }
    .lines line:nth-child(6) { animation-delay: 0.40s; }
    .lines line:nth-child(7) { animation-delay: 0.48s; }
    .lines line:nth-child(8) { animation-delay: 0.56s; }
    .lines line:nth-child(9) { animation-delay: 0.64s; }
    .lines line:nth-child(10) { animation-delay: 0.72s; }
    .lines line:nth-child(11) { animation-delay: 0.80s; }
    .lines line:nth-child(12) { animation-delay: 0.88s; }
    @keyframes draw {
      0% { stroke-dashoffset: 90; opacity: 0.25; }
      40% { stroke-dashoffset: 0; opacity: 0.85; }
      75% { stroke-dashoffset: 0; opacity: 0.85; }
      100% { stroke-dashoffset: 0; opacity: 0.25; }
    }
    .nodes circle { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
    .nodes circle:nth-child(1) { animation-delay: 0s; }
    .nodes circle:nth-child(2) { animation-delay: 0.3s; }
    .nodes circle:nth-child(3) { animation-delay: 0.6s; }
    .nodes circle:nth-child(4) { animation-delay: 0.9s; }
    .nodes circle:nth-child(5) { animation-delay: 1.2s; }
    .nodes circle:nth-child(6) { animation-delay: 1.5s; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.55); opacity: 1; } }
    .core { transform-box: fill-box; transform-origin: center; animation: core 2.4s ease-in-out infinite; }
    @keyframes core { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.18); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .glow, .lines line, .nodes circle, .core { animation: none; }
      .lines line { stroke-dashoffset: 0; opacity: 0.72; }
    }
  </style>
  <circle class="glow" cx="100" cy="100" r="116" fill="url(#glow)"/>
  <circle cx="100" cy="100" r="93" fill="#16181D" stroke="url(#lsg)" stroke-width="4"/>
  <g class="lines" stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round">
    <line x1="100" y1="40" x2="152" y2="70"/>
    <line x1="152" y1="70" x2="152" y2="130"/>
    <line x1="152" y1="130" x2="100" y2="160"/>
    <line x1="100" y1="160" x2="48" y2="130"/>
    <line x1="48" y1="130" x2="48" y2="70"/>
    <line x1="48" y1="70" x2="100" y2="40"/>
    <line x1="100" y1="40" x2="100" y2="100"/>
    <line x1="152" y1="70" x2="100" y2="100"/>
    <line x1="152" y1="130" x2="100" y2="100"/>
    <line x1="100" y1="160" x2="100" y2="100"/>
    <line x1="48" y1="130" x2="100" y2="100"/>
    <line x1="48" y1="70" x2="100" y2="100"/>
  </g>
  <g class="nodes" fill="url(#lsg)">
    <circle cx="100" cy="40" r="7"/>
    <circle cx="152" cy="70" r="7"/>
    <circle cx="152" cy="130" r="7"/>
    <circle cx="100" cy="160" r="7"/>
    <circle cx="48" cy="130" r="7"/>
    <circle cx="48" cy="70" r="7"/>
  </g>
  <circle class="core" cx="100" cy="100" r="9" fill="url(#lsg)"/>
</svg>
