name: Measured Signals (Trends, YouTube, Reddit, Social)

# Collects the MII inputs that the upstream pipeline ships empty — Google
# Trends (weight 0.15), YouTube (0.10) and Social (0.05) — into per-model,
# per-month CSVs that mii-normalize.js joins onto the results in the browser.
#
# This replaces the older social-signals.yml. It is one workflow rather than
# four because the collectors write into the same commit and the social
# composite has to run last: it blends whatever Reddit and YouTube data landed
# in the steps above it.
#
# Runs daily, not monthly, because two of the collectors cannot cover the
# ~3,300-model universe in a single run. The YouTube Data API allows 10,000
# quota units/day and one model costs 101, and Google rate-limits Trends
# scraping hard. Each collector therefore spends a per-run budget on the models
# it has measured least recently (tracked in data/*_state.csv) and upserts its
# results, so daily runs converge on full coverage in a few weeks and then keep
# it fresh on a rolling basis.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   YOUTUBE_API_KEY       YouTube Data API v3 key. Without it the YouTube step
#                         is skipped and that input stays empty.
#   REDDIT_CLIENT_ID      Free "script" app at https://www.reddit.com/prefs/apps
#   REDDIT_CLIENT_SECRET
#   SERPAPI_API_KEY       OPTIONAL. When set, the Trends collector uses SerpAPI
#                         instead of scraping trends.google.com, which is the
#                         reliable path if Google starts blocking the runners.

on:
  schedule:
    - cron: '23 6 * * *'   # 06:23 UTC daily
  workflow_dispatch:
    inputs:
      trends_budget:
        description: 'Google Trends batches this run (4 models each)'
        default: '400'
      youtube_budget:
        description: 'YouTube API units this run (daily quota is 10000)'
        default: '9000'
      reddit_budget:
        description: 'Reddit requests this run'
        default: '4000'
      force_wiki:
        description: 'Refresh Wikipedia pageviews even if already current'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'data/pipelines/*.py'

permissions:
  contents: write
  actions: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Stdlib only — nothing to install.
      - name: Unit tests
        run: python data/pipelines/test_pipelines.py

      # Each collector is continue-on-error: a rate limit, an exhausted quota
      # or a missing secret must not stop the others or lose the rows already
      # collected. Every one of them checkpoints its output as it goes.
      - name: Google Trends
        continue-on-error: true
        timeout-minutes: 180
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          python data/pipelines/google_trends.py \
            --budget "${{ github.event.inputs.trends_budget || 400 }}"

      - name: YouTube
        continue-on-error: true
        timeout-minutes: 60
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python data/pipelines/youtube_signals.py \
            --budget "${{ github.event.inputs.youtube_budget || 9000 }}"

      - name: Reddit
        continue-on-error: true
        timeout-minutes: 90
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          python data/pipelines/reddit_signals.py \
            --budget "${{ github.event.inputs.reddit_budget || 4000 }}"

      # Runs last: rebuilds social_score from every sub-signal now on disk.
      # Refreshes Wikipedia only when the month has turned over.
      - name: Social composite
        timeout-minutes: 60
        run: |
          python data/pipelines/social_signals.py \
            ${{ github.event.inputs.force_wiki == 'true' && '--force-wiki' || '' }}

      - name: Commit outputs
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A collector that was skipped (no secret) or that has never run
          # leaves its file absent, and a bare `git add` on a missing path is
          # a fatal error — so stage only what exists.
          for f in data/social_signals.csv data/wikipedia_slugs.csv \
                   data/google_trends.csv data/google_trends_state.csv \
                   data/youtube_signals.csv data/youtube_state.csv \
                   data/reddit_signals.csv data/reddit_state.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No new signal data — nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh measured signals (trends, youtube, reddit, social)"
            git pull --rebase origin main
            git push origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN never trigger other workflows, so the
      # Pages deploy has to be dispatched explicitly.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
