name: Data Pipelines (Auction Ratings + MAI)

# Pulls live-auction lots from the canonical auction store (entered through
# the /store panel in garage-draft's admin app) into data/auction_lots.csv,
# writes lots of sales still to come (estimates only) to
# data/upcoming_lots.csv for the pre-sale view on mai.html,
# recomputes data/auction_ratings.csv and data/mai_scores.csv, commits the
# results, and re-triggers the Pages deploy so the dashboard's MAI chart
# picks them up. The explicit deploy dispatch is required because pushes
# made with GITHUB_TOKEN never trigger other workflows on their own.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CANONICAL_SUPABASE_URL       URL of the Supabase project holding the store
#   CANONICAL_SUPABASE_ANON_KEY  that project's anon key; the export reads the
#                                anon-readable public.auction_live_lots view
# Without them the export step is skipped and the existing CSV is used.

on:
  schedule:
    - cron: '41 7 * * *'   # 07:41 UTC daily: pick up lots entered the day before
  push:
    branches: [main]
    paths:
      - 'data/auction_lots.csv'
      - 'data/pipelines/export_live_lots.py'
      - 'data/pipelines/auction_rating.py'
      - 'data/pipelines/mai.py'
  workflow_dispatch:
    inputs:
      allow_drop_events:
        description: 'Write the export even if hand-entered events in auction_lots.csv are missing from the store'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: data-pipelines
  cancel-in-progress: false

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas

      # Only the tests for what this job runs: a failure stops it before it
      # commits anything, and the published scores stay as they were.
      - name: Unit tests (export and MAI)
        run: python data/pipelines/test_pipelines.py LiveLotsExport MaiScores

      # Leaves auction_lots.csv untouched (with a warning) if the secrets are
      # unset or if the store is missing an event the CSV already has.
      - name: Export live-auction lots from the canonical store
        env:
          CANONICAL_SUPABASE_URL: ${{ secrets.CANONICAL_SUPABASE_URL }}
          CANONICAL_SUPABASE_ANON_KEY: ${{ secrets.CANONICAL_SUPABASE_ANON_KEY }}
        run: |
          python data/pipelines/export_live_lots.py \
            ${{ github.event.inputs.allow_drop_events == 'true' && '--allow-drop-events' || '' }}

      - name: Run pipelines
        run: |
          python data/pipelines/auction_rating.py
          python data/pipelines/mai.py

      - name: Commit regenerated outputs
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auction_lots.csv data/upcoming_lots.csv data/auction_ratings.csv data/mai_scores.csv
          if git diff --cached --quiet; then
            echo "No changes in auction lots or derived CSVs — nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: export live-auction lots and regenerate MAI"
            git pull --rebase origin main
            git push origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
